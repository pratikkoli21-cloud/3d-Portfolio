<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Rainbow Button — YouTube Shorts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #fff6e8;
      --sky: #7ec8ff;
      --coral: #ff5a6a;
      --lemon: #ffe566;
      --mint: #7dffb3;
      --lilac: #c9a8ff;
      --ink: #2b1d4a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0820;
      font-family: "Nunito", system-ui, sans-serif;
      color: white;
    }

    .stage-wrap {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 30% 20%, rgba(255, 90, 106, 0.25), transparent 45%),
        radial-gradient(ellipse at 70% 80%, rgba(126, 200, 255, 0.22), transparent 40%),
        radial-gradient(ellipse at 50% 50%, #241244, #0d0820 70%);
    }

    .phone {
      position: relative;
      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      aspect-ratio: 9 / 16;
      border-radius: 28px;
      overflow: hidden;
      box-shadow:
        0 0 0 3px rgba(255, 255, 255, 0.12),
        0 30px 80px rgba(0, 0, 0, 0.55);
      background: #1a1035;
      isolation: isolate;
    }

    .scene {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: scale(1.08);
      transition: opacity 0.55s ease, transform 3.2s ease-out;
      will-change: opacity, transform;
    }

    .scene img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .scene.active {
      opacity: 1;
      transform: scale(1);
      z-index: 2;
    }

    .scene.zoom-in.active { transform: scale(1.12); }
    .scene.zoom-out { transform: scale(1.14); }
    .scene.zoom-out.active { transform: scale(1); }
    .scene.pan-up.active { transform: scale(1.1) translateY(-2.5%); }
    .scene.spin-feel.active { transform: scale(1.08) rotate(-1.5deg); }

    .fx {
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: 5;
      overflow: hidden;
    }

    .sparkle {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 12px 4px rgba(255, 255, 255, 0.7);
      opacity: 0;
      animation: twinkle 1.4s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(0.4); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .confetti {
      position: absolute;
      top: -20px;
      width: 12px;
      height: 18px;
      border-radius: 3px;
      opacity: 0;
      animation: fall 2.4s linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(-10%) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translateY(110vh) rotate(420deg); opacity: 0.85; }
    }

    .beam {
      position: absolute;
      top: -10%;
      left: 50%;
      width: 18%;
      height: 130%;
      transform-origin: top center;
      background: linear-gradient(180deg, rgba(255,255,255,0.55), transparent 70%);
      filter: blur(8px);
      opacity: 0;
      mix-blend-mode: screen;
    }

    .title-card, .end-card, .speech {
      position: absolute;
      z-index: 8;
      text-align: center;
      pointer-events: none;
    }

    .title-card {
      inset: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, rgba(36, 18, 68, 0.15), rgba(36, 18, 68, 0.35));
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .title-card.show { opacity: 1; }

    .title-card h1 {
      font-family: "Baloo 2", cursive;
      font-size: clamp(2.2rem, 9vw, 3.4rem);
      line-height: 1.05;
      letter-spacing: 0.02em;
      color: #fff;
      text-shadow:
        0 4px 0 #ff5a6a,
        0 8px 24px rgba(0,0,0,0.35);
      padding: 0 1rem;
    }

    .speech {
      left: 50%;
      bottom: 14%;
      transform: translateX(-50%) scale(0.7);
      opacity: 0;
      transition: opacity 0.35s ease, transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .speech.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    .speech .bubble {
      background: #fff;
      color: var(--ink);
      font-family: "Baloo 2", cursive;
      font-weight: 800;
      font-size: clamp(1.25rem, 5.5vw, 1.85rem);
      padding: 0.7rem 1.15rem;
      border-radius: 999px;
      box-shadow: 0 10px 30px rgba(255, 90, 106, 0.35);
      border: 4px solid #ff8fa0;
      white-space: nowrap;
    }

    .speech .bubble::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -14px;
      transform: translateX(-50%);
      border: 10px solid transparent;
      border-top-color: #fff;
      filter: drop-shadow(0 2px 0 #ff8fa0);
    }

    .flash {
      position: absolute;
      inset: 0;
      z-index: 7;
      background: radial-gradient(circle, #fff 0%, #7ec8ff 40%, transparent 70%);
      opacity: 0;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .flash.blue { background: radial-gradient(circle, #fff 0%, #5bbcff 35%, transparent 70%); }
    .flash.rainbow {
      background:
        conic-gradient(from 0deg, #ff5a6a, #ffe566, #7dffb3, #7ec8ff, #c9a8ff, #ff5a6a);
      mix-blend-mode: soft-light;
    }

    .progress {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 3.5%;
      height: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.22);
      z-index: 9;
      overflow: hidden;
    }

    .progress > span {
      display: block;
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ff5a6a, #ffe566, #7dffb3, #7ec8ff, #c9a8ff);
    }

    .badge {
      position: absolute;
      top: 3.5%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9;
      font-family: "Baloo 2", cursive;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.35rem 0.8rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(8px);
      opacity: 0.95;
    }

    .replay {
      position: absolute;
      bottom: 7%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 0.75rem 1.35rem;
      font-family: "Baloo 2", cursive;
      font-size: 1.05rem;
      background: white;
      color: var(--ink);
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(0,0,0,0.3);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .replay.show {
      opacity: 1;
      pointer-events: auto;
    }

    body.capture .badge,
    body.capture .progress,
    body.capture .replay {
      display: none !important;
    }

    body.capture .phone {
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div class="stage-wrap">
    <div class="phone" id="phone" aria-label="The Rainbow Button animation">
      <div class="badge">The Rainbow Button</div>

      <div class="scene zoom-in" data-scene="0">
        <img src="./rb-01-curious.jpg" alt="Curious child notices glowing red button" />
      </div>
      <div class="scene zoom-out" data-scene="1">
        <img src="./rb-02-blue.jpg" alt="Room turns bright blue" />
      </div>
      <div class="scene pan-up" data-scene="2">
        <img src="./rb-03-rainbow.jpg" alt="Rainbow magical transformation" />
      </div>
      <div class="scene spin-feel" data-scene="3">
        <img src="./rb-04-celebrate.jpg" alt="Child jumps and spins joyfully" />
      </div>
      <div class="scene zoom-in" data-scene="4">
        <img src="./rb-05-button.jpg" alt="Button says press me again" />
      </div>

      <div class="fx" id="fx"></div>
      <div class="flash" id="flash"></div>

      <div class="title-card" id="titleCard">
        <h1>The Rainbow Button</h1>
      </div>

      <div class="speech" id="speech">
        <div class="bubble">Press me again!</div>
      </div>

      <div class="progress"><span id="bar"></span></div>
      <button class="replay" id="replay" type="button">Play again ✨</button>
    </div>
  </div>

  <script>
    const TOTAL_MS = 15000;
    const scenes = [...document.querySelectorAll(".scene")];
    const fx = document.getElementById("fx");
    const flash = document.getElementById("flash");
    const titleCard = document.getElementById("titleCard");
    const speech = document.getElementById("speech");
    const bar = document.getElementById("bar");
    const replay = document.getElementById("replay");

    const beats = [
      { at: 0, scene: 0, fx: "curious", title: true },
      { at: 1800, scene: 0, fx: "curious", title: false },
      { at: 3000, scene: 1, fx: "blue", flash: "blue" },
      { at: 6000, scene: 2, fx: "rainbow", flash: "rainbow" },
      { at: 10000, scene: 3, fx: "celebrate" },
      { at: 13000, scene: 4, fx: "button", speech: true },
    ];

    let startedAt = 0;
    let raf = 0;
    let timers = [];
    let playing = false;

    function clearFx() {
      fx.innerHTML = "";
    }

    function spawnSparkles(count, palette) {
      for (let i = 0; i < count; i++) {
        const s = document.createElement("div");
        s.className = "sparkle";
        s.style.left = Math.random() * 100 + "%";
        s.style.top = Math.random() * 100 + "%";
        s.style.background = palette[i % palette.length];
        s.style.animationDelay = (Math.random() * 1.2) + "s";
        s.style.width = (6 + Math.random() * 10) + "px";
        s.style.height = s.style.width;
        fx.appendChild(s);
      }
    }

    function spawnConfetti(count) {
      const colors = ["#ff5a6a", "#ffe566", "#7dffb3", "#7ec8ff", "#c9a8ff", "#ff9f43"];
      for (let i = 0; i < count; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "%";
        c.style.background = colors[i % colors.length];
        c.style.animationDelay = (Math.random() * 1.8) + "s";
        c.style.animationDuration = (1.8 + Math.random() * 1.4) + "s";
        c.style.transform = `rotate(${Math.random() * 180}deg)`;
        fx.appendChild(c);
      }
    }

    function spawnBeams(count) {
      for (let i = 0; i < count; i++) {
        const b = document.createElement("div");
        b.className = "beam";
        const angle = -40 + (80 / (count - 1)) * i;
        b.style.transform = `translateX(-50%) rotate(${angle}deg)`;
        b.style.opacity = "0.55";
        b.style.background = [
          "linear-gradient(180deg, rgba(255,90,106,0.7), transparent 70%)",
          "linear-gradient(180deg, rgba(255,229,102,0.7), transparent 70%)",
          "linear-gradient(180deg, rgba(125,255,179,0.7), transparent 70%)",
          "linear-gradient(180deg, rgba(126,200,255,0.7), transparent 70%)",
          "linear-gradient(180deg, rgba(201,168,255,0.7), transparent 70%)",
        ][i % 5];
        fx.appendChild(b);
      }
    }

    function setFxMode(mode) {
      clearFx();
      if (mode === "curious") {
        spawnSparkles(14, ["#ff8fa0", "#fff", "#ffe566"]);
      } else if (mode === "blue") {
        spawnSparkles(28, ["#9ad8ff", "#ffffff", "#5bbcff"]);
      } else if (mode === "rainbow") {
        spawnBeams(5);
        spawnSparkles(24, ["#ff5a6a", "#ffe566", "#7dffb3", "#7ec8ff", "#c9a8ff"]);
        spawnConfetti(28);
      } else if (mode === "celebrate") {
        spawnSparkles(30, ["#ff5a6a", "#ffe566", "#7dffb3", "#7ec8ff", "#c9a8ff"]);
        spawnConfetti(36);
      } else if (mode === "button") {
        spawnSparkles(18, ["#ff8fa0", "#ffe566", "#fff"]);
        spawnConfetti(12);
      }
    }

    function showScene(index) {
      scenes.forEach((el, i) => {
        el.classList.toggle("active", i === index);
      });
    }

    function pulseFlash(kind) {
      flash.className = "flash " + (kind || "");
      flash.style.transition = "opacity 0.12s ease";
      flash.style.opacity = "0.9";
      requestAnimationFrame(() => {
        setTimeout(() => {
          flash.style.transition = "opacity 0.55s ease";
          flash.style.opacity = "0";
        }, 80);
      });
    }

    function clearTimers() {
      timers.forEach(clearTimeout);
      timers = [];
      cancelAnimationFrame(raf);
    }

    function tick() {
      const elapsed = performance.now() - startedAt;
      const p = Math.min(1, elapsed / TOTAL_MS);
      bar.style.width = (p * 100) + "%";
      if (p < 1 && playing) {
        raf = requestAnimationFrame(tick);
      } else if (p >= 1) {
        playing = false;
        replay.classList.add("show");
      }
    }

    function play() {
      clearTimers();
      playing = true;
      replay.classList.remove("show");
      speech.classList.remove("show");
      titleCard.classList.remove("show");
      flash.style.opacity = "0";
      bar.style.width = "0%";
      showScene(0);
      setFxMode("curious");
      startedAt = performance.now();
      raf = requestAnimationFrame(tick);

      beats.forEach((beat) => {
        timers.push(setTimeout(() => {
          showScene(beat.scene);
          if (beat.fx) setFxMode(beat.fx);
          if (beat.flash) pulseFlash(beat.flash);
          titleCard.classList.toggle("show", !!beat.title);
          speech.classList.toggle("show", !!beat.speech);
        }, beat.at));
      });

      timers.push(setTimeout(() => {
        playing = false;
        replay.classList.add("show");
      }, TOTAL_MS));
    }

    replay.addEventListener("click", play);

    if (new URLSearchParams(location.search).has("capture")) {
      document.body.classList.add("capture");
    }

    // Autoplay once images are ready
    Promise.all(
      [...document.images].map(
        (img) =>
          img.complete
            ? Promise.resolve()
            : new Promise((res) => {
                img.onload = img.onerror = res;
              })
      )
    ).then(() => {
      // Tiny delay so first paint is clean for capture mode
      setTimeout(play, new URLSearchParams(location.search).has("capture") ? 200 : 400);
    });
  </script>
</body>
</html>
