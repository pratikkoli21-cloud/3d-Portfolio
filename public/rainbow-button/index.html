<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Rainbow Button — YouTube Shorts Video</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #2b1d4a;
      --coral: #ff5a6a;
      --cream: #fff7ec;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      font-family: "Nunito", system-ui, sans-serif;
      color: white;
      background:
        radial-gradient(ellipse at 20% 15%, rgba(255, 90, 106, 0.28), transparent 40%),
        radial-gradient(ellipse at 80% 85%, rgba(126, 200, 255, 0.25), transparent 42%),
        linear-gradient(160deg, #241244, #0d0820 70%);
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      gap: 1rem;
    }

    .frame {
      width: min(100%, 420px);
      aspect-ratio: 9 / 16;
      border-radius: 24px;
      overflow: hidden;
      background: #111;
      box-shadow:
        0 0 0 3px rgba(255, 255, 255, 0.12),
        0 28px 70px rgba(0, 0, 0, 0.45);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #111;
    }

    .meta {
      width: min(100%, 420px);
      text-align: center;
    }

    h1 {
      font-family: "Baloo 2", cursive;
      font-size: clamp(1.6rem, 5vw, 2.1rem);
      line-height: 1.1;
      margin-bottom: 0.35rem;
      text-shadow: 0 3px 0 var(--coral);
    }

    p {
      opacity: 0.9;
      font-size: 0.98rem;
    }

    a {
      color: #ffe566;
      font-weight: 800;
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }

    body.capture .meta { display: none; }
    body.capture .page { padding: 0; }
    body.capture .frame {
      width: 100vw;
      height: 100vh;
      max-width: none;
      border-radius: 0;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="frame">
      <video
        id="short"
        src="./the-rainbow-button-shorts.mp4"
        controls
        playsinline
        autoplay
        muted
        loop
        poster="./rb-01-curious.jpg"
        aria-label="The Rainbow Button YouTube Shorts video"
      ></video>
    </div>
    <div class="meta">
      <h1>The Rainbow Button</h1>
      <p>15s · 9:16 · 1080×1920 · <a href="./the-rainbow-button-shorts.mp4" download>Download MP4</a></p>
    </div>
  </main>
  <script>
    if (new URLSearchParams(location.search).has("capture")) {
      document.body.classList.add("capture");
      const v = document.getElementById("short");
      v.muted = true;
      v.play().catch(() => {});
    }
  </script>
</body>
</html>
